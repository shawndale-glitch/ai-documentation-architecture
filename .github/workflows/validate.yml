name: Validate corpus

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/requirements.txt

      - run: pip install -r tooling/requirements.txt

      - name: Validate topics and export retrieval artifacts
        run: python tooling/validate_corpus.py examples --export build

      - name: Upload retrieval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-artifacts
          path: build/
