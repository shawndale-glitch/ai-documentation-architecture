[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waypoint-sdk"
version = "0.1.0"
description = "Python SDK for the fictional Waypoint Rentals API (portfolio example)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["waypoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
